<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 85" width="850" height="85">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulseGlow {
        0%, 100% { stroke-opacity: 0.25; }
        50% { stroke-opacity: 0.6; }
      }
      .card-border {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="85" rx="10" fill="url(#quoteBg)" stroke="#00F0FF" stroke-width="1.2" class="card-border"/>

  <!-- Left Accent Bar -->
  <rect x="18" y="18" width="3" height="49" rx="1.5" fill="#00F0FF" filter="url(#cyanGlow)"/>

  <!-- Quote Symbol -->
  <text x="36" y="44" fill="#00F0FF" font-family="'Georgia', serif" font-size="34" font-weight="bold" opacity="0.6">“</text>

  <!-- Main Quote Text -->
  <text x="65" y="38" fill="#E2E8F0" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="500">
    In security as in life: whatever remains static becomes vulnerable. <tspan fill="#00F0FF" font-weight="bold">Adaptability is the ultimate armor.</tspan>
  </text>

  <!-- Author / Attribution -->
  <text x="65" y="60" fill="#64748B" font-family="'Fira Code', 'Courier New', monospace" font-size="11" letter-spacing="1">
    — <tspan fill="#10B981">CYBER PHILOSOPHY</tspan> // CONTINUOUS HARDENING
  </text>
</svg>
