<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="50%" stop-color="#070e1b"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <!-- Radar Cone Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes blipPulse {
        0%, 100% { opacity: 0.15; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes blipAlert {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; fill: #EF4444; }
      }
      @keyframes scanlineAnim {
        0% { transform: translateY(-220px); opacity: 0.1; }
        50% { opacity: 0.35; }
        100% { transform: translateY(220px); opacity: 0.1; }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes textStream {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
      }

      .radar-sweep-group {
        transform-origin: 110px 110px;
        animation: radarRotate 4s linear infinite;
      }
      .blip-1 { transform-origin: 145px 80px; animation: blipPulse 2s ease-in-out infinite; }
      .blip-2 { transform-origin: 80px 150px; animation: blipPulse 2.8s ease-in-out infinite 0.5s; }
      .blip-3 { transform-origin: 155px 140px; animation: blipPulse 2.2s ease-in-out infinite 1s; }
      .blip-alert { transform-origin: 65px 75px; animation: blipAlert 1.5s ease-in-out infinite; }
      .cursor { animation: cursorBlink 0.9s infinite; }
      .stream-line { animation: textStream 3s ease-in-out infinite; }
      .scanline-bar { animation: scanlineAnim 5s linear infinite; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="850" height="220" rx="14" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect width="850" height="220" rx="14" fill="url(#cyberGrid)"/>

  <!-- Scanning Sweep Line across entire card -->
  <line x1="0" y1="0" x2="850" y2="0" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.25" class="scanline-bar"/>

  <!-- ==================== LEFT: CYBER DEFENSE RADAR HUD ==================== -->
  <g id="radar-hud">
    <!-- Outer Ring -->
    <circle cx="110" cy="110" r="85" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4,4"/>
    <circle cx="110" cy="110" r="65" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="110" cy="110" r="45" fill="none" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="3,3"/>
    <circle cx="110" cy="110" r="22" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.45"/>

    <!-- Crosshairs -->
    <line x1="20" y1="110" x2="200" y2="110" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>
    <line x1="110" y1="20" x2="110" y2="200" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Rotating Radar Sweep Cone -->
    <g class="radar-sweep-group">
      <path d="M 110 110 L 195 110 A 85 85 0 0 1 170 170 Z" fill="url(#radarSweep)"/>
      <line x1="110" y1="110" x2="195" y2="110" stroke="#00F0FF" stroke-width="1.5" filter="url(#cyanGlow)"/>
    </g>

    <!-- Radar Nodes / Blips -->
    <circle cx="145" cy="80" r="3.5" fill="#10B981" class="blip-1" filter="url(#cyanGlow)"/>
    <circle cx="80" cy="150" r="3" fill="#00F0FF" class="blip-2" filter="url(#cyanGlow)"/>
    <circle cx="155" cy="140" r="3.5" fill="#10B981" class="blip-3"/>
    <circle cx="65" cy="75" r="3" fill="#EF4444" class="blip-alert"/>

    <!-- Center Node -->
    <circle cx="110" cy="110" r="4.5" fill="#00F0FF" filter="url(#cyanGlow)"/>

    <!-- Radar HUD Labels -->
    <text x="110" y="206" fill="#00F0FF" font-family="'Fira Code', 'Courier New', monospace" font-size="9" text-anchor="middle" letter-spacing="1.5" opacity="0.8">RADAR: ACTIVE_SCAN</text>
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="225" y1="20" x2="225" y2="200" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6,4"/>

  <!-- ==================== RIGHT: THREAT TELEMETRY CONSOLE ==================== -->
  <g id="telemetry-terminal" transform="translate(250, 0)">
    <!-- Terminal Header Badge -->
    <rect x="0" y="22" width="170" height="20" rx="4" fill="#00F0FF" fill-opacity="0.12" stroke="#00F0FF" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="12" cy="32" r="3.5" fill="#10B981" filter="url(#cyanGlow)"/>
    <text x="24" y="36" fill="#00F0FF" font-family="'Fira Code', 'Courier New', monospace" font-size="10.5" font-weight="bold" letter-spacing="1">DEFENSE_MATRIX // 0x7F</text>

    <!-- System Status Badges -->
    <rect x="440" y="22" width="135" height="20" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="507" y="36" fill="#10B981" font-family="'Fira Code', 'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="0.5">PERIMETER: SECURE</text>

    <!-- Terminal Lines -->
    <g font-family="'Fira Code', 'Courier New', monospace" font-size="12">
      <!-- Line 1: IDS Status -->
      <text x="0" y="68" fill="#94A3B8">
        <tspan fill="#00F0FF" font-weight="bold">[IDS_TELEMETRY]</tspan> Suricata Core Engine ── <tspan fill="#10B981">0 Threat Signatures Detected</tspan>
      </text>

      <!-- Line 2: Cryptographic Handshake -->
      <text x="0" y="93" fill="#94A3B8" class="stream-line">
        <tspan fill="#38BDF8" font-weight="bold">[ENCRYPTION]</tspan> P2P Mesh Handshake ── <tspan fill="#00F0FF">AES-256-GCM Verified</tspan>
      </text>

      <!-- Line 3: ESP32 IoT Nodes -->
      <text x="0" y="118" fill="#94A3B8">
        <tspan fill="#F59E0B" font-weight="bold">[HARDWARE_IOT]</tspan> ESP32 Proximity Nodes ── <tspan fill="#10B981">8 Active / Tamper-Resistant</tspan>
      </text>

      <!-- Line 4: AI Threat Classifier -->
      <text x="0" y="143" fill="#94A3B8">
        <tspan fill="#A855F7" font-weight="bold">[AI_CLASSIFIER]</tspan> CloakBuster &amp; CyberPath-AI ── <tspan fill="#00F0FF">Threat Horizon Synced</tspan>
      </text>

      <!-- Line 5: Interactive Terminal Prompt -->
      <text x="0" y="172" fill="#E2E8F0">
        <tspan fill="#00F0FF" font-weight="bold">achumith@cyber-core:~$</tspan> audit --perimeter --continuous
      </text>
      <!-- Blinking Cursor -->
      <rect x="425" y="160" width="8" height="14" fill="#00F0FF" class="cursor"/>
    </g>

    <!-- Bottom Telemetry Bar -->
    <line x1="0" y1="188" x2="575" y2="188" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="0" y="204" fill="#64748B" font-family="'Fira Code', 'Courier New', monospace" font-size="9.5">
      SEC_LEVEL: <tspan fill="#00F0FF">MAXIMUM</tspan> | INTEGRITY: <tspan fill="#10B981">100%</tspan> | PROTOCOL: <tspan fill="#38BDF8">ZERO_TRUST</tspan> | NODE: <tspan fill="#E2E8F0">achumith-station</tspan>
    </text>
  </g>
</svg>
